<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Toy Pairwise Ranker{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <style>
    .muted { color: #666; }
    .score { font-variant-numeric: tabular-nums; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .centered-auth { max-width: 520px; margin: 1rem auto; }
    .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .table-wrap { overflow-x: auto; }
    .aspect-judge { margin-bottom: .85rem; padding: .6rem; border: 1px solid #d9d9d9; border-radius: .6rem; }
    .choice-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .35rem; margin-top: .35rem; align-items: stretch; }
    .choice-grid > div { display: flex; }
    .choice-grid input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
    .choice-box {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 3rem;
      height: 100%;
      text-align: center;
      line-height: 1.15;
      padding: .45rem .35rem;
      border-radius: .45rem;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: .82rem;
      line-height: 1.2;
      user-select: none;
      color: #111;
    }
    .choice-better { background: #66bb6a; color: #111; }
    .choice-sbetter { background: #c8e6c9; }
    .choice-comparable { background: #cfd8dc; }
    .choice-sworse { background: #ffccbc; }
    .choice-worse { background: #ef9a9a; color: #111; }
    .choice-grid input[type="radio"]:checked + .choice-box {
      border-color: #111;
      border-width: 4px;
      box-shadow: inset 0 0 0 2px #111;
      transform: translateY(-1px);
    }
    .aspect-judge.choice-pending .choice-grid input[type="radio"]:checked + .choice-box {
      border-style: dashed;
      border-width: 4px;
      box-shadow: inset 0 0 0 2px #111;
    }
    .hover-detail { position: relative; overflow: visible; }
    .hover-detail > .hover-card {
      display: none;
      position: absolute;
      left: 50%;
      top: calc(100% + .35rem);
      transform: translateX(-50%);
      width: min(36rem, 86vw);
      z-index: 30;
      text-align: left;
      font-size: .9rem;
      padding: .6rem .7rem;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .20);
      background: var(--card-background-color, #fff);
      border: 1px solid var(--muted-border-color, #cfd8dc);
      border-radius: .6rem;
    }
    .hover-detail:hover > .hover-card,
    .hover-detail:focus-within > .hover-card { display: block; }
  </style>
</head>
<body>
<main class="container">
  <h1><a href="{{ url_for('routes.index') }}">Toy Pairwise Ranker</a></h1>
  {% block content %}{% endblock %}
</main>
<script>
  (function () {
    if (window.htmx && window.htmx.config) {
      window.htmx.config.scrollIntoViewOnBoost = false;
      window.htmx.config.defaultSwapStyle = "innerHTML";
    }
    let lastScrollY = 0;
    document.body.addEventListener("htmx:beforeRequest", function () {
      lastScrollY = window.scrollY || window.pageYOffset || 0;
    });
    function restoreScroll() {
      window.requestAnimationFrame(function () {
        window.scrollTo({ top: lastScrollY, behavior: "auto" });
      });
    }
    document.body.addEventListener("htmx:afterSwap", restoreScroll);
    document.body.addEventListener("htmx:afterSettle", restoreScroll);
  })();
</script>
</body>
</html>

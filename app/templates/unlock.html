{% extends "base.html" %}
{% block title %}Unlock {{ project.name }}{% endblock %}
{% block content %}
<article>
  <h2>Unlock project: {{ project.name }}</h2>
  {% if project.description %}<p class="muted">{{ project.description }}</p>{% endif %}
  {% if error %}<p style="color: #b00020;">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('routes.unlock_project', project_id=project.id) }}">
    <label>Password <input type="password" name="password" required autofocus></label>
    <button type="submit">Unlock</button>
  </form>
</article>
{% endblock %}
